<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飓风接力 · 效率看板</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* ========================================
           效率看板专用样式
           ======================================== */
        
        .filter-bar {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        
        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .filter-label {
            font-size: 13px;
            color: var(--text-secondary);
        }
        
        .filter-select {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 13px;
            background: var(--bg-white);
            cursor: pointer;
            min-width: 150px;
        }
        
        .filter-select:focus {
            outline: none;
            border-color: var(--accent-color);
        }
        
        .analytics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 24px;
        }
        
        @media (max-width: 1200px) {
            .analytics-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .analytics-card {
            background: var(--bg-white);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }
        
        .analytics-card.full-width {
            grid-column: 1 / -1;
        }
        
        .analytics-card-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .analytics-card-title {
            font-size: 14px;
            font-weight: 600;
        }
        
        .analytics-card-body {
            padding: 20px;
        }
        
        /* ========================================
           采纳率环形图
           ======================================== */
        
        .adoption-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }
        
        .adoption-item {
            text-align: center;
        }
        
        .adoption-ring {
            width: 80px;
            height: 80px;
            margin: 0 auto 8px;
            position: relative;
        }
        
        .adoption-ring svg {
            transform: rotate(-90deg);
        }
        
        .adoption-ring-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            font-weight: 700;
        }
        
        .adoption-ring-label.good { color: #10B981; }
        .adoption-ring-label.warn { color: #F59E0B; }
        .adoption-ring-label.low { color: #EF4444; }
        
        .adoption-name {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 2px;
        }
        
        .adoption-detail {
            font-size: 11px;
            color: var(--text-tertiary);
        }
        
        /* ========================================
           状态条
           ======================================== */
        
        .status-bar {
            margin-bottom: 12px;
        }
        
        .status-bar-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        
        .status-bar-label {
            font-size: 13px;
            color: var(--text-secondary);
        }
        
        .status-bar-value {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .status-bar-track {
            height: 24px;
            background: var(--bg-primary);
            border-radius: 4px;
            overflow: hidden;
        }
        
        .status-bar-fill {
            height: 100%;
            display: flex;
            align-items: center;
            padding-left: 8px;
            font-size: 11px;
            color: white;
            font-weight: 500;
        }
        
        .status-bar-fill.pending { background: var(--warning-color); }
        .status-bar-fill.delivered { background: var(--success-color); }
        .status-bar-fill.archived { background: #6B7280; }
        
        /* ========================================
           关键词云
           ======================================== */
        
        .keyword-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .keyword-tag {
            padding: 6px 12px;
            border-radius: 100px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s;
        }
        
        .keyword-tag:hover {
            transform: scale(1.05);
        }
        
        .keyword-tag.size-lg {
            background: rgba(99, 102, 241, 0.15);
            color: #4F46E5;
            font-weight: 600;
            font-size: 15px;
        }
        
        .keyword-tag.size-md {
            background: rgba(99, 102, 241, 0.1);
            color: #6366F1;
            font-weight: 500;
        }
        
        .keyword-tag.size-sm {
            background: rgba(99, 102, 241, 0.06);
            color: #818CF8;
        }
        
        /* ========================================
           电商素材统计
           ======================================== */
        
        .ecommerce-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }
        
        .eco-stat {
            text-align: center;
            padding: 16px;
            background: var(--bg-primary);
            border-radius: 8px;
        }
        
        .eco-stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #10B981;
        }
        
        .eco-stat-label {
            font-size: 12px;
            color: var(--text-tertiary);
            margin-top: 4px;
        }
        
        /* ========================================
           风险列表
           ======================================== */
        
        .risk-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.15s;
        }
        
        .risk-item:hover {
            background: var(--bg-primary);
        }
        
        .risk-item:last-child {
            border-bottom: none;
        }
        
        .risk-info {
            flex: 1;
        }
        
        .risk-type {
            font-size: 14px;
            font-weight: 500;
        }
        
        .risk-project {
            font-size: 12px;
            color: var(--text-tertiary);
            display: block;
            margin-top: 2px;
        }
        
        .risk-count {
            font-size: 18px;
            font-weight: 700;
            color: var(--warning-color);
            margin-right: 8px;
        }
        
        .risk-arrow {
            color: var(--text-tertiary);
        }
        
        /* ========================================
           项目详情列表
           ======================================== */
        
        .project-detail-list {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .project-detail-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.15s;
        }
        
        .project-detail-item:hover {
            background: var(--bg-primary);
        }
        
        .project-detail-info {
            flex: 1;
        }
        
        .project-detail-title {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 4px;
        }
        
        .project-detail-meta {
            font-size: 12px;
            color: var(--text-tertiary);
            display: flex;
            gap: 12px;
        }
        
        .project-detail-stats {
            display: flex;
            gap: 16px;
            align-items: center;
        }
        
        .project-stat {
            text-align: center;
        }
        
        .project-stat-value {
            font-size: 16px;
            font-weight: 600;
        }
        
        .project-stat-label {
            font-size: 10px;
            color: var(--text-tertiary);
        }
        
        .project-stat-value.risk { color: var(--warning-color); }
        .project-stat-value.point { color: var(--accent-color); }
        
        .empty-analytics {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-tertiary);
        }
        
        .empty-analytics-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        .data-source-note {
            font-size: 11px;
            color: var(--text-tertiary);
            padding: 8px 12px;
            background: var(--bg-primary);
            border-radius: 4px;
            margin-bottom: 20px;
        }
    </style>
</head>

    <script src="app.js"></script>
    <script>
        // ========================================
        // 效率看板 — 全部数据从项目实时计算
        // ========================================
        
        let currentFilters = { project: 'all', status: 'all' };
        
        function init() {
            populateProjectFilter();
            renderAll();
            bindEvents();
        }
        
        function renderAll() {
            renderAdoptionRate();
            renderStatusDistribution();
            renderEcommerceStats();
            renderKeywordCloud();
            renderRiskList();
            renderProjectDetailList();
            updateStats();
        }
        
        function populateProjectFilter() {
            const projects = getAllProjects();
            const select = document.getElementById('projectFilter');
            projects.forEach(p => {
                const option = document.createElement('option');
                option.value = p.id;
                option.textContent = p.title.length > 20 ? p.title.substring(0, 20) + '...' : p.title;
                select.appendChild(option);
            });
        }
        
        function getFilteredProjects() {
            return getAllProjects().filter(p => {
                if (currentFilters.project !== 'all' && p.id !== currentFilters.project) return false;
                if (currentFilters.status !== 'all' && p.status !== currentFilters.status) return false;
                return true;
            });
        }
        
        // ========================================
        // AI 标注采纳率 — 从 status 字段实时计算
        // ========================================
        
        function renderAdoptionRate() {
            const filtered = getFilteredProjects();
            
            const categories = [
                { key: 'sellingPoints', label: '核心卖点', items: [] },
                { key: 'timestamps', label: '关键时间点', items: [] },
                { key: 'cautions', label: '注意事项', items: [] }
            ];
            
            filtered.forEach(p => {
                categories.forEach(cat => {
                    if (p[cat.key]) cat.items.push(...p[cat.key]);
                });
            });
            
            const container = document.getElementById('adoptionGrid');
            container.innerHTML = categories.map(cat => {
                const total = cat.items.length;
                if (total === 0) {
                    return `<div class="adoption-item">
                        <div class="adoption-ring">
                            <svg width="80" height="80"><circle cx="40" cy="40" r="32" fill="none" stroke="#E5E7EB" stroke-width="6"/></svg>
                            <div class="adoption-ring-label low">—</div>
                        </div>
                        <div class="adoption-name">${cat.label}</div>
                        <div class="adoption-detail">暂无数据</div>
                    </div>`;
                }
                
                const confirmed = cat.items.filter(i => i.status === 'confirmed').length;
                const edited = cat.items.filter(i => i.status === 'edited').length;
                const adopted = confirmed + edited;
                const rate = Math.round(adopted / total * 100);
                const rateClass = rate >= 70 ? 'good' : rate >= 40 ? 'warn' : 'low';
                
                const circumference = 2 * Math.PI * 32;
                const dashOffset = circumference * (1 - rate / 100);
                const strokeColor = rate >= 70 ? '#10B981' : rate >= 40 ? '#F59E0B' : '#EF4444';
                
                return `<div class="adoption-item">
                    <div class="adoption-ring">
                        <svg width="80" height="80">
                            <circle cx="40" cy="40" r="32" fill="none" stroke="#E5E7EB" stroke-width="6"/>
                            <circle cx="40" cy="40" r="32" fill="none" stroke="${strokeColor}" stroke-width="6"
                                    stroke-dasharray="${circumference}" stroke-dashoffset="${dashOffset}"
                                    stroke-linecap="round"/>
                        </svg>
                        <div class="adoption-ring-label ${rateClass}">${rate}%</div>
                    </div>
                    <div class="adoption-name">${cat.label}</div>
                    <div class="adoption-detail">确认 ${confirmed} · 编辑 ${edited} / 共 ${total}</div>
                </div>`;
            }).join('');
        }
        
        // ========================================
        // 项目状态分布
        // ========================================
        
        function renderStatusDistribution() {
            const filtered = getFilteredProjects();
            const pending = filtered.filter(p => p.status === 'pending').length;
            const delivered = filtered.filter(p => p.status === 'delivered').length;
            const archived = filtered.filter(p => p.status === 'archived').length;
            const total = filtered.length || 1;
            
            document.getElementById('statusDistribution').innerHTML = `
                <div class="status-bar">
                    <div class="status-bar-header">
                        <span class="status-bar-label">待剪辑确认</span>
                        <span class="status-bar-value">${pending}</span>
                    </div>
                    <div class="status-bar-track">
                        <div class="status-bar-fill pending" style="width:${pending/total*100}%">${pending > 0 ? pending + '个' : ''}</div>
                    </div>
                </div>
                <div class="status-bar">
                    <div class="status-bar-header">
                        <span class="status-bar-label">已交付运营</span>
                        <span class="status-bar-value">${delivered}</span>
                    </div>
                    <div class="status-bar-track">
                        <div class="status-bar-fill delivered" style="width:${delivered/total*100}%">${delivered > 0 ? delivered + '个' : ''}</div>
                    </div>
                </div>
                <div class="status-bar">
                    <div class="status-bar-header">
                        <span class="status-bar-label">已上线归档</span>
                        <span class="status-bar-value">${archived}</span>
                    </div>
                    <div class="status-bar-track">
                        <div class="status-bar-fill archived" style="width:${archived/total*100}%">${archived > 0 ? archived + '个' : ''}</div>
                    </div>
                </div>`;
        }
        
        // ========================================
        // 电商素材产出 — 从 ecommerceAssets 聚合
        // ========================================
        
        function renderEcommerceStats() {
            const filtered = getFilteredProjects();
            let totalAssets = 0, confirmedAssets = 0, totalProducts = new Set();
            
            filtered.forEach(p => {
                if (p.ecommerceAssets) {
                    totalAssets += p.ecommerceAssets.length;
                    confirmedAssets += p.ecommerceAssets.filter(a => a.status === 'confirmed').length;
                    p.ecommerceAssets.forEach(a => {
                        if (a.product) totalProducts.add(a.product);
                    });
                }
            });
            
            document.getElementById('ecommerceStats').innerHTML = totalAssets === 0
                ? '<div class="empty-analytics"><p>暂无电商素材数据</p></div>'
                : `<div class="ecommerce-stats">
                    <div class="eco-stat">
                        <div class="eco-stat-value">${totalAssets}</div>
                        <div class="eco-stat-label">识别片段</div>
                    </div>
                    <div class="eco-stat">
                        <div class="eco-stat-value">${confirmedAssets}</div>
                        <div class="eco-stat-label">已确认可用</div>
                    </div>
                    <div class="eco-stat">
                        <div class="eco-stat-value">${totalProducts.size}</div>
                        <div class="eco-stat-label">涉及产品</div>
                    </div>
                </div>`;
        }
        
        // ========================================
        // 卖点关键词 — 直接从卖点文本提取高频词
        // ========================================
        
        function renderKeywordCloud() {
            const filtered = getFilteredProjects();
            const wordCounts = {};
            
            filtered.forEach(p => {
                if (p.sellingPoints) {
                    p.sellingPoints.forEach(sp => {
                        const words = extractKeywords(sp.content);
                        words.forEach(w => { wordCounts[w] = (wordCounts[w] || 0) + 1; });
                    });
                }
                if (p.ecommerceAssets) {
                    p.ecommerceAssets.forEach(a => {
                        if (a.consumerLanguage) {
                            const words = extractKeywords(a.consumerLanguage);
                            words.forEach(w => { wordCounts[w] = (wordCounts[w] || 0) + 1; });
                        }
                    });
                }
            });
            
            const sorted = Object.entries(wordCounts).sort((a, b) => b[1] - a[1]).slice(0, 15);
            const container = document.getElementById('keywordCloud');
            
            if (sorted.length === 0) {
                container.innerHTML = '<p style="color:var(--text-tertiary);text-align:center;padding:20px;">暂无关键词数据</p>';
                return;
            }
            
            container.innerHTML = sorted.map(([kw, count], i) => {
                const size = i < 3 ? 'lg' : i < 7 ? 'md' : 'sm';
                return `<span class="keyword-tag size-${size}" data-keyword="${kw}">${kw} (${count})</span>`;
            }).join('');
        }
        
        function extractKeywords(text) {
            if (!text) return [];
            const keywords = [];
            const patterns = [
                '性价比', '画质', '便携', '稳定', '防抖', '4K', '8K', '7K',
                '直播', '推流', '对焦', '续航', '色彩', '专业', '电影感',
                'Raw', '全画幅', '大底', '翻转屏', '触控', '无线',
                '保暖', '保温', '防风', '防水', '轻量', '耐穿', '面料',
                '3M', '新雪丽', '冲锋衣', '滤镜', 'Snap', 'STORMCREW',
                '零下', '极寒', '户外', '实测', '穿搭', '模特'
            ];
            patterns.forEach(p => {
                if (text.includes(p)) keywords.push(p);
            });
            return keywords;
        }
        
        // ========================================
        // 风险类型统计
        // ========================================
        
        function renderRiskList() {
            const filtered = getFilteredProjects();
            const risksByType = {};
            
            filtered.forEach(p => {
                if (p.cautions) {
                    p.cautions.forEach(c => {
                        const type = c.level === 'medium' ? '中风险' : '低风险';
                        if (!risksByType[type]) risksByType[type] = [];
                        risksByType[type].push({ content: c.content, projectId: p.id, projectTitle: p.title });
                    });
                }
            });
            
            const container = document.getElementById('riskList');
            
            if (Object.keys(risksByType).length === 0) {
                container.innerHTML = '<div class="empty-analytics"><div class="empty-analytics-icon">✅</div><p>筛选范围内无风险预警</p></div>';
                return;
            }
            
            container.innerHTML = Object.entries(risksByType).map(([type, risks]) => `
                <div class="risk-item" data-type="${type}">
                    <div class="risk-info">
                        <span class="risk-type">${type === '中风险' ? '⚠️' : 'ℹ️'} ${type}</span>
                        <span class="risk-project">${risks.length}个项目涉及</span>
                    </div>
                    <span class="risk-count">${risks.length}</span>
                    <span class="risk-arrow">→</span>
                </div>
            `).join('');
            
            container.querySelectorAll('.risk-item').forEach(item => {
                item.addEventListener('click', function() {
                    const type = this.dataset.type;
                    const related = risksByType[type];
                    const detail = related.map(r => `• ${r.projectTitle}: ${r.content}`).join('\n');
                    if (confirm(`【${type}】详情：\n\n${detail}\n\n点击确定跳转第一个相关项目`)) {
                        if (related.length > 0) window.location.href = `project.html?id=${related[0].projectId}`;
                    }
                });
            });
        }
        
        // ========================================
        // 项目详情列表
        // ========================================
        
        function renderProjectDetailList() {
            const filtered = getFilteredProjects();
            const container = document.getElementById('projectDetailList');
            document.getElementById('filteredCount').textContent = `共 ${filtered.length} 个项目`;
            
            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-analytics"><div class="empty-analytics-icon">📭</div><p>筛选范围内无项目</p></div>';
                return;
            }
            
            const statusLabels = { pending: '待剪辑确认', delivered: '已交付运营', archived: '已上线归档' };
            
            container.innerHTML = filtered.map(p => {
                const pointCount = p.sellingPoints ? p.sellingPoints.length : 0;
                const ecoCount = p.ecommerceAssets ? p.ecommerceAssets.length : 0;
                return `
                <div class="project-detail-item" data-id="${p.id}">
                    <div class="project-detail-info">
                        <div class="project-detail-title">${p.isReal ? '🎬 ' : ''}${p.title}</div>
                        <div class="project-detail-meta">
                            <span>📅 ${p.createdAt}</span>
                            <span>${statusLabels[p.status]}</span>
                        </div>
                    </div>
                    <div class="project-detail-stats">
                        <div class="project-stat">
                            <div class="project-stat-value point">${pointCount}</div>
                            <div class="project-stat-label">卖点</div>
                        </div>
                        <div class="project-stat">
                            <div class="project-stat-value" style="color:#10B981">${ecoCount}</div>
                            <div class="project-stat-label">电商素材</div>
                        </div>
                    </div>
                </div>`;
            }).join('');
            
            container.querySelectorAll('.project-detail-item').forEach(item => {
                item.addEventListener('click', function() {
                    window.location.href = `project.html?id=${this.dataset.id}`;
                });
            });
        }
        
        // ========================================
        // 概览统计
        // ========================================
        
        function updateStats() {
            const filtered = getFilteredProjects();
            document.getElementById('totalProjects').textContent = filtered.length;
            
            let totalAnnotations = 0, totalRisks = 0, totalAssets = 0;
            filtered.forEach(p => {
                totalAnnotations += (p.sellingPoints ? p.sellingPoints.length : 0) +
                                   (p.timestamps ? p.timestamps.length : 0) +
                                   (p.cautions ? p.cautions.length : 0);
                totalRisks += p.cautions ? p.cautions.length : 0;
                totalAssets += p.ecommerceAssets ? p.ecommerceAssets.length : 0;
            });
            
            document.getElementById('totalAnnotations').textContent = totalAnnotations;
            document.getElementById('totalRisks').textContent = totalRisks;
            document.getElementById('totalAssets').textContent = totalAssets;
        }
        
        // ========================================
        // 事件绑定
        // ========================================
        
        function bindEvents() {
            document.getElementById('applyFilter').addEventListener('click', function() {
                currentFilters.project = document.getElementById('projectFilter').value;
                currentFilters.status = document.getElementById('statusFilter').value;
                renderAll();
                showToast('筛选已应用');
            });
            
            document.getElementById('resetFilter').addEventListener('click', function() {
                document.getElementById('projectFilter').value = 'all';
                document.getElementById('statusFilter').value = 'all';
                currentFilters = { project: 'all', status: 'all' };
                renderAll();
                showToast('筛选已重置');
            });
            
            document.getElementById('keywordCloud').addEventListener('click', function(e) {
                if (e.target.classList.contains('keyword-tag')) {
                    const kw = e.target.dataset.keyword;
                    const related = getFilteredProjects().filter(p =>
                        (p.sellingPoints && p.sellingPoints.some(sp => sp.content.includes(kw))) ||
                        (p.ecommerceAssets && p.ecommerceAssets.some(a => a.consumerLanguage && a.consumerLanguage.includes(kw)))
                    );
                    alert(`关键词【${kw}】出现在以下项目中：\n\n${related.map(p => '• ' + p.title).join('\n')}`);
                }
            });
        }
        
        init();
    </script>
</body>
</html>
